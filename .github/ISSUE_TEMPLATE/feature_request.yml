name: Idea or question
description: Suggest a feature, ask how to do something, or share how you use Hufu.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Ideas and questions are welcome. 中文或英文都可以。
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What you are trying to do, and what would help.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. What you tried, or how you work around it now.
