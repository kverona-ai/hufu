name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The toolchain that formatting and lints are checked with. Raise it on purpose, in its own change.
  LINT_TOOLCHAIN: "1.97.0"
  # Keep in step with `rust-version` in src/Cargo.toml.
  MSRV: "1.89.0"

defaults:
  run:
    shell: bash
    working-directory: src

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$LINT_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
          rustup default "$LINT_TOOLCHAIN"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
        env:
          # One known place for the tests' throwaway homes on every platform.
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - name: Self-test of the built binary
        run: |
          export HUFU_HOME="$RUNNER_TEMP/hufu-home"
          cargo run --locked --quiet -p hufu-cli -- doctor --self-test
      - name: Keep what failed tests left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-leftovers-${{ matrix.os }}
          path: ${{ runner.temp }}/hufu-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          rustup default "$MSRV"
      - run: cargo check --locked --all-targets

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install/install.sh
      - run: shellcheck install/install.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install/install.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
