# Sample mission definition.
# Start with:  hufu mission start -f mission.yaml
# Reference: doc/guide/user-guide.md, "Missions".

version: 1

goal: |
  Migrate the HTTP client in this repository from callbacks to async/await.
  Keep behaviour identical and keep the test suite green.

advisor: claude                  # any profile can advise; default: roles.advisor

executors:                       # the roster the advisor may dispatch to
  - codex-any                    # a pool: either Codex account
  - kimi
  - agy-fast

cwd: .
isolation: worktree
review: always                   # the advisor reviews every result

budgets:
  max_tasks: 12
  max_rounds_per_task: 3
  max_wall_clock: 3h
  max_tokens: 4000000            # applied only where agents report usage

max_tier: workspace-write        # the advisor cannot request more than this for any task
max_parallel: 2                  # tasks that do not depend on each other may run side by side

acceptance_commands:             # command prefixes the advisor may use in acceptance checks
  - npm test

acceptance:                      # checked once more against the finished mission
  - command: npm test
